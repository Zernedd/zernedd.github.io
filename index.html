<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zern</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <div class="background"></div>

  <div class="content">
    <div class="avatar-wrap">
      <img src="assets/profile.png" class="circle-photo" id="discord-avatar" />
      <span id="discord-status" class="status-dot" title="offline"></span>
    </div>
    <div id="custom-status" class="custom-status"></div>
    <h1 id="intro">Hiiii! I'm Zern</h1>
    <p>Idiot • Hobbyist programmer • Self Taught Beginner Security Engineer • Community Security @ Another Axiom</p>

    <div id="latest-video"></div>
    <script src="latestVideo.js"></script>

    <div class="buttons">
      <a href="https://github.com/Zernedd" target="_blank">GitHub</a>
      <a href="https://tlk.io/zernedd" target="_blank">Wanna Chat? Click here!</a>
     

     
     
    </div>
  </div>




  <!-- embedded js my goat -->
  <script>
    const text = "Hiiii! I'm Zern (:";
    const intro = document.getElementById("intro");
    let i = 0;
    intro.textContent = "";

    function type() {
      if (i < text.length) {
        intro.textContent += text.charAt(i);
        i++;
        setTimeout(type, 100);
      }
    }
    type();

    const factthing = [
      "I somehow break things when trying to fix them.",
      "I love trying to break code more than writing it.",
      "I got into computers because my dad blocked youtube on an old school laptop.",
      "I can never leave something alone even when I know I shouldnt touch it."
    ];

    setTimeout(() => {
      const p = document.createElement("p");
      p.textContent = "Fact About Me: " + factthing[Math.floor(Math.random() * factthing.length)];
      document.getElementById("intro").insertAdjacentElement("afterend", p);
    }, text.length * 100 + 500);

    const photo = document.querySelector(".circle-photo");
//discord stuff done with ai because im a lazy bum
    const DISCORD_ID = "1298056496298328094";
    const statusDot = document.getElementById("discord-status");
    const customStatusEl = document.getElementById("custom-status");

    function renderCustomStatus(activities) {
      const custom = activities?.find(a => a.type === 4);
      if (!custom) {
        customStatusEl.innerHTML = "";
        return;
      }
      let emojiHtml = "";
      if (custom.emoji) {
        if (custom.emoji.id) {
          const ext = custom.emoji.animated ? "gif" : "png";
          emojiHtml = `<img class="status-emoji" src="https://cdn.discordapp.com/emojis/${custom.emoji.id}.${ext}" alt="${custom.emoji.name}" />`;
        } else if (custom.emoji.name) {
          emojiHtml = `<span class="status-emoji">${custom.emoji.name}</span>`;
        }
      }
      const text = custom.state ? `<span>${custom.state.replace(/[<>]/g, "")}</span>` : "";
      customStatusEl.innerHTML = emojiHtml + text;
    }

    async function updateDiscordPresence() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const { data, success } = await res.json();
        if (!success) return;

        if (data.discord_user?.avatar) {
          const hash = data.discord_user.avatar;
          const ext = hash.startsWith("a_") ? "gif" : "png";
          photo.src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${hash}.${ext}?size=512`;
        }

        const status = data.discord_status || "offline";
        statusDot.dataset.status = status;
        statusDot.title = status;

        renderCustomStatus(data.activities);
      } catch (e) {
        console.warn("Lanyard fetch failed:", e);
      }
    }

    updateDiscordPresence();
    setInterval(updateDiscordPresence, 30000);

    document.addEventListener("mousemove", e => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      photo.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });
  </script>

</body>
</html>
